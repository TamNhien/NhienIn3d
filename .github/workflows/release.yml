name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: nhienin3d
          POSTGRES_USER: nhienin3d_app
          POSTGRES_PASSWORD: NhienIn3d_Release_CI_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nhienin3d_app -d nhienin3d"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://nhienin3d_app:NhienIn3d_Release_CI_2026@localhost:5432/nhienin3d?schema=public
      ADMIN_EMAIL: release-ci@nhienin3d.local
      ADMIN_PASSWORD: NhienIn3d_Release_Admin_2026
      ADMIN_NAME: Release CI

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Cài dependencies
        run: npm ci

      - name: Test + typecheck
        run: |
          npm test
          npm run typecheck

      - name: Migration + seed v2.3.0
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed
          npm run db:kiem-tra-du-lieu

      - name: Build API + Web
        run: npm run build

      - name: Security audit
        run: npm run audit:security

      - name: Đóng gói source
        run: |
          mkdir -p release
          git archive --format=zip --output="release/NhienIn3d-${GITHUB_REF_NAME}-source.zip" HEAD
          sha256sum release/*.zip > release/SHA256SUMS.txt

      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/tamnhien/nhienin3d-api:${{ github.ref_name }}
            ghcr.io/tamnhien/nhienin3d-api:latest

      - name: Build và push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          tags: |
            ghcr.io/tamnhien/nhienin3d-web:${{ github.ref_name }}
            ghcr.io/tamnhien/nhienin3d-web:latest

      - name: Tạo GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/NhienIn3d-${{ github.ref_name }}-source.zip
            release/SHA256SUMS.txt
