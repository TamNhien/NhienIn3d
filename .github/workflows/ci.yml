name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: nhienin3d
          POSTGRES_USER: nhienin3d_app
          POSTGRES_PASSWORD: NhienIn3d_CI_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nhienin3d_app -d nhienin3d"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://nhienin3d_app:NhienIn3d_CI_2026@localhost:5432/nhienin3d?schema=public
      ADMIN_EMAIL: ci-admin@nhienin3d.local
      ADMIN_PASSWORD: NhienIn3d_CI_Admin_2026
      ADMIN_NAME: CI Admin

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Cài dependencies
        run: npm install

      - name: Kiem tra mysql2 secure install tree
        run: |
          npm run security:mysql2

      - name: Test root + workspaces
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Migration + seed database
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed
          npm run db:kiem-tra-du-lieu

      - name: Build API + Web
        run: npm run build

      - name: Kiểm tra lỗ hổng dependency nghiêm trọng
        run: npm run audit:security

  runtime-docker:
    name: Runtime Docker smoke
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: nhienin3d
      POSTGRES_USER: nhienin3d_app
      POSTGRES_PASSWORD: NhienIn3d_Docker_CI_2026
      ADMIN_EMAIL: docker-ci@nhienin3d.local
      ADMIN_PASSWORD: NhienIn3d_Docker_Admin_2026
      ADMIN_NAME: Docker CI
      JWT_SECRET: 4fe8de85fb4b4f7ea750876adbeb47163e54ac3e5ed58dbe50d25249be7b0a12
      COOKIE_SECRET: ci-cookie-secret-nhienin3d-v330-2026
      MAIL_ENABLED: "false"
      SYSTEM_HEALTH_EMAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Docker Compose migration + API
        run: |
          docker compose up -d --build postgres migrate api
          docker compose ps
      - name: Chờ API health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3001/api/v1/suc-khoe >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs api --tail 150
          exit 1
      - name: Runtime E2E Admin + backup restore
        shell: pwsh
        # e2e-runtime-v3140.ps1 gọi lại e2e-runtime-v320.ps1 để giữ regression backup/restore.
        run: ./scripts/e2e-runtime-v3140.ps1
      - name: Khởi động Web HTTPS cho browser E2E
        run: |
          docker compose up -d --build web https
          for i in {1..40}; do
            if curl -kfsS https://localhost:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs web https --tail 150
          exit 1
      - name: Cài Playwright Chromium
        run: |
          npm install
          npm run audit:security
          npx playwright install --with-deps chromium
      - name: Browser E2E Admin HTTPS v3.14.0
        run: npm run e2e:browser
      - name: Docker logs khi thất bại
        if: failure()
        run: |
          docker compose logs migrate --tail 150 || true
          docker compose logs api --tail 150 || true
          docker compose logs web --tail 150 || true
          docker compose logs https --tail 150 || true
      - name: Dọn Docker
        if: always()
        run: docker compose down -v --remove-orphans
