name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: nhienin3d
          POSTGRES_USER: nhienin3d_app
          POSTGRES_PASSWORD: NhienIn3d_CI_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nhienin3d_app -d nhienin3d"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://nhienin3d_app:NhienIn3d_CI_2026@localhost:5432/nhienin3d?schema=public
      ADMIN_EMAIL: ci-admin@nhienin3d.local
      ADMIN_PASSWORD: NhienIn3d_CI_Admin_2026
      ADMIN_NAME: CI Admin

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Cài dependencies
        run: npm ci

      - name: Test root + workspaces
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Migration + seed v2.4.1
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed
          npm run db:kiem-tra-du-lieu

      - name: Build API + Web
        run: npm run build

      - name: Kiểm tra lỗ hổng dependency nghiêm trọng
        run: npm run audit:security
