name: nhienin3d
services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: nhienin3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nhienin3d}
      POSTGRES_USER: ${POSTGRES_USER:-nhienin3d_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - nhienin3d-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nhienin3d_app} -d ${POSTGRES_DB:-nhienin3d}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nhienin3d-noi-bo]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    container_name: nhienin3d-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nhienin3d_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nhienin3d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nhienin3d.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-System Admin}
    command: ["sh", "-lc", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [nhienin3d-noi-bo]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nhienin3d-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nhienin3d_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nhienin3d}
      API_PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nhienin3d.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-System Admin}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [nhienin3d-noi-bo]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    container_name: nhienin3d-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks: [nhienin3d-noi-bo]

networks:
  nhienin3d-noi-bo:
    driver: bridge
volumes:
  nhienin3d-postgres-data:
