name: nhienin3d
services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: nhienin3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nhienin3d}
      POSTGRES_USER: ${POSTGRES_USER:-nhienin3d_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - nhienin3d-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nhienin3d_app} -d ${POSTGRES_DB:-nhienin3d}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nhienin3d-noi-bo]

  mailpit:
    profiles: ["mailpit"]
    image: axllent/mailpit:v1.30.6
    container_name: nhienin3d-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks: [nhienin3d-noi-bo]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    container_name: nhienin3d-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nhienin3d_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nhienin3d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nhienin3d.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-System Admin}
    command: ["sh", "-lc", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [nhienin3d-noi-bo]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nhienin3d-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nhienin3d_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nhienin3d}
      API_PORT: 3001
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-600}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nhienin3d.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-System Admin}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost:3000,http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_CONNECTION_TIMEOUT: ${MAIL_CONNECTION_TIMEOUT:-5000}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-5000}
      MAIL_WRITE_TIMEOUT: ${MAIL_WRITE_TIMEOUT:-5000}
      MAIL_TLS_REJECT_UNAUTHORIZED: ${MAIL_TLS_REJECT_UNAUTHORIZED:-true}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-https://localhost:3000}
      RESET_PASSWORD_EXPIRES_MINUTES: ${RESET_PASSWORD_EXPIRES_MINUTES:-15}
      LOW_STOCK_EMAIL_ENABLED: ${LOW_STOCK_EMAIL_ENABLED:-false}
      LOW_STOCK_EMAIL_INTERVAL_MINUTES: ${LOW_STOCK_EMAIL_INTERVAL_MINUTES:-60}
      LOW_STOCK_EMAIL_TO: ${LOW_STOCK_EMAIL_TO:-}
      BACKUP_DIRECTORY: /app/backups
      SYSTEM_HEALTH_EMAIL_ENABLED: ${SYSTEM_HEALTH_EMAIL_ENABLED:-false}
      SYSTEM_HEALTH_EMAIL_INTERVAL_MINUTES: ${SYSTEM_HEALTH_EMAIL_INTERVAL_MINUTES:-30}
      SYSTEM_HEALTH_EMAIL_TO: ${SYSTEM_HEALTH_EMAIL_TO:-}
      SYSTEM_HEALTH_BACKUP_MAX_AGE_HOURS: ${SYSTEM_HEALTH_BACKUP_MAX_AGE_HOURS:-36}
      SYSTEM_HEALTH_ALERT_SILENCE_MINUTES: ${SYSTEM_HEALTH_ALERT_SILENCE_MINUTES:-180}
      SYSTEM_HEALTH_ALERT_ESCALATION_MINUTES: ${SYSTEM_HEALTH_ALERT_ESCALATION_MINUTES:-720}
      SYSTEM_SLO_SLA_TARGET_PERCENT: ${SYSTEM_SLO_SLA_TARGET_PERCENT:-99}
      SYSTEM_SLO_UPTIME_TARGET_PERCENT: ${SYSTEM_SLO_UPTIME_TARGET_PERCENT:-99.9}
      SYSTEM_SLO_TREND_ALERT_ENABLED: ${SYSTEM_SLO_TREND_ALERT_ENABLED:-true}
      SYSTEM_ALERT_WEBHOOK_ENABLED: ${SYSTEM_ALERT_WEBHOOK_ENABLED:-false}
      SYSTEM_ALERT_WEBHOOK_URL: ${SYSTEM_ALERT_WEBHOOK_URL:-}
      SYSTEM_ALERT_WEBHOOK_ADAPTER: ${SYSTEM_ALERT_WEBHOOK_ADAPTER:-GENERIC}
      SYSTEM_SLO_ENDPOINT_INTERVAL_MINUTES: ${SYSTEM_SLO_ENDPOINT_INTERVAL_MINUTES:-5}
      SYSTEM_ALERT_WEBHOOK_BEARER_TOKEN: ${SYSTEM_ALERT_WEBHOOK_BEARER_TOKEN:-}
      SYSTEM_ALERT_WEBHOOK_SECRET: ${SYSTEM_ALERT_WEBHOOK_SECRET:-}
      SYSTEM_ALERT_WEBHOOK_MAX_RETRIES: ${SYSTEM_ALERT_WEBHOOK_MAX_RETRIES:-3}
      SYSTEM_ALERT_WEBHOOK_BACKOFF_MS: ${SYSTEM_ALERT_WEBHOOK_BACKOFF_MS:-750}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./backups:/app/backups:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [nhienin3d-noi-bo]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: nhienin3d-web
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      api:
        condition: service_started
    networks: [nhienin3d-noi-bo]

  https:
    image: caddy:2.10.2-alpine
    container_name: nhienin3d-https
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:443"
    volumes:
      - ./infra/caddy/Caddyfile.local-https:/etc/caddy/Caddyfile:ro
      - nhienin3d-caddy-data:/data
      - nhienin3d-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_started
    networks: [nhienin3d-noi-bo]

networks:
  nhienin3d-noi-bo:
    driver: bridge
volumes:
  nhienin3d-postgres-data:
  nhienin3d-caddy-data:
  nhienin3d-caddy-config:
